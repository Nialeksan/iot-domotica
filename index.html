<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma para aprender Internet de las Cosas y domótica: módulos, prácticas interactivas y cuestionarios." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Aprende IoT y Domótica</title>
    <script>
      try {
        var t = localStorage.getItem("iot-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
